name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # With the mcp and dxf extras, so the MCP adapter and DXF export tests run and pyright
      # sees both packages.
      - name: Install
        run: python -m pip install -e ".[dev,mcp,dxf]"
      - name: pytest
        env:
          APECAD_REQUIRE_NODE: "1"
        run: python -m pytest -q
      - name: ruff check
        run: python -m ruff check src tests
      - name: pyright (strict, src/)
        run: pyright

  core:
    # The core package without extras: it imports, the MCP and DXF tests skip cleanly, and
    # tests/test_dxf_unavailable.py checks ezdxf stays out of `import apeCAD`.
    name: core without extras (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q -rs
